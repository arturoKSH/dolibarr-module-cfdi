# Validate module version and changelog on pull requests; publish tags and releases from master.
name: version

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate module version and changelog
        shell: bash
        run: |
          new_version=$(grep -oP "\\\$this->version = '\\K[0-9]+\\.[0-9]+\\.[0-9]+(?=')" core/modules/modCfdi.class.php || true)
          git show "origin/${{ github.base_ref }}:core/modules/modCfdi.class.php" > /tmp/base-module.php
          old_version=$(grep -oP "\\\$this->version = '\\K[0-9]+\\.[0-9]+(\\.[0-9]+)?(?=')" /tmp/base-module.php || true)
          echo "Base version: ${old_version:-none} -> PR version: ${new_version:-none}"
          [ -n "$new_version" ] || { echo "::error::modCfdi.class.php must declare a semantic version x.y.z"; exit 1; }

          if [ -n "$old_version" ]; then
            normalized_old="$old_version"
            case "$normalized_old" in
              *.*.*) ;;
              *) normalized_old="$normalized_old.0" ;;
            esac
            if [ "$old_version" != "$normalized_old" ] && [ "$new_version" = "$normalized_old" ]; then
              echo "Migrating legacy version $old_version to semantic version $new_version"
            else
              latest=$(printf '%s\\n%s\\n' "$normalized_old" "$new_version" | sort -V | tail -n 1)
              if [ "$latest" != "$new_version" ] || [ "$new_version" = "$normalized_old" ]; then
                echo "::error::Increase the module version from $old_version"
                exit 1
              fi
            fi
          fi

          awk -v version="$new_version" '$0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 { found=1 } END { exit !found }' ChangeLog.md || { echo "::error::ChangeLog.md needs a section for $new_version"; exit 1; }

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(grep -oP "\\\$this->version = '\\K[0-9]+\\.[0-9]+\\.[0-9]+(?=')" core/modules/modCfdi.class.php || true)
          [ -n "$version" ] || { echo "::error::modCfdi.class.php must declare a semantic version x.y.z"; exit 1; }
          awk -v version="$version" '$0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 { found=1 } END { exit !found }' ChangeLog.md || { echo "::error::ChangeLog.md has no section for $version"; exit 1; }

          tag="v$version"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            tagged_commit=$(git rev-list -n 1 "$tag")
            [ "$tagged_commit" = "$GITHUB_SHA" ] || { echo "::error::Tag $tag already points to another commit"; exit 1; }
          else
            git tag "$tag"
            git push origin "$tag"
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            awk -v version="$version" '$0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 { found=1; next } found && index($0, "## [") == 1 { exit } found { print }' ChangeLog.md > release-notes.md
            [ -s release-notes.md ] || { echo "::error::No release notes found for $version"; exit 1; }
            gh release create "$tag" --title "$tag" --notes-file release-notes.md
          fi
